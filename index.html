<html lang="en">
<head>
<meta charset="utf-8">

<title>Santos Kids Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2433;--muted:#667085;--line:#e3e6ec;--pencil:#f2b705;--err:#c2410c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151c;--panel:#1a1f29;--ink:#e8ebf2;--muted:#98a2b3;--line:#2a3140;--pencil:#f5c23a;--err:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--panel:#1a1f29;--ink:#e8ebf2;--muted:#98a2b3;--line:#2a3140;--pencil:#f5c23a;--err:#fb923c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 "Figtree",system-ui,sans-serif;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{font:800 26px "Bricolage Grotesque",system-ui,sans-serif;margin:0}
p{margin:0;color:var(--muted)}
label{font-weight:600;font-size:13px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
button{font:600 15px "Figtree",system-ui,sans-serif;padding:11px;border:0;border-radius:9px;background:var(--pencil);color:#1d2433;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{color:var(--err);font-size:13px;min-height:1em}
</style>
<script>function sunTimes(d){const lat=40.83,lng=-74.11,R=Math.PI/180,y=d.getFullYear(),m=d.getMonth(),dd=d.getDate(),mid=Date.UTC(y,m,dd),n=Math.round((mid-Date.UTC(y,0,0))/864e5),g=2*Math.PI/365*(n-1),eq=229.18*(7.5e-5+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g)),de=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g),ha=Math.acos(Math.cos(90.833*R)/(Math.cos(lat*R)*Math.cos(de))-Math.tan(lat*R)*Math.tan(de))/R;return[new Date(mid+(720-4*(lng+ha)-eq)*6e4),new Date(mid+(720-4*(lng-ha)-eq)*6e4)];}
function autoTheme(t){t=t||new Date();const s=sunTimes(t);return t>=s[0]&&t<s[1]?"light":"dark";}
function nextFlip(t){t=t||new Date();const s=sunTimes(t);if(t<s[0])return s[0];if(t<s[1])return s[1];const u=new Date(t);u.setDate(u.getDate()+1);return sunTimes(u)[0];}
function chosenTheme(){try{const o=JSON.parse(localStorage.getItem("kids-week-theme-pick")||"null");if(o&&o.until>Date.now())return o.theme;}catch(_){}return autoTheme();}
document.documentElement.dataset.theme=chosenTheme();</script>
</head>

  <label class="row"><input id="remember" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Open schedule</button>

</form>

const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(IV)},key,unb64(CT));
  return new TextDecoder().decode(pt);
}
function show(html){
  const go=()=>{document.open();document.write(html);document.close();};
  if(document.readyState==="complete") go(); else window.addEventListener("load",go,{once:true});
}
async function derive(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  let saved=null; try{saved=localStorage.getItem(STORE);}catch(e){}
  if(saved){
    document.getElementById("f").hidden=true;
    try{const k=await crypto.subtle.importKey("raw",unb64(saved),"AES-GCM",false,["decrypt"]);show(await unlock(k));return;}
    catch(e){try{localStorage.removeItem(STORE);}catch(_){} document.getElementById("f").hidden=false;}
  }
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("go"),msg=document.getElementById("msg");
  btn.disabled=true;btn.textContent="Unlocking…";msg.textContent="";
  try{
    const key=await derive(document.getElementById("pw").value.trim());
    const html=await unlock(key);
    if(document.getElementById("remember").checked){
      try{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));localStorage.setItem(STORE,btoa(String.fromCharCode(...raw)));}catch(_){}
    }
    show(html);
  }catch(err){
    msg.textContent="That passphrase didn't work. Check the spelling and try again.";
    btn.disabled=false;btn.textContent="Open schedule";
  }
});
</script>
